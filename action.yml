name: "Doc Scribe (Suggest)"
description: "Fails PRs that add TypeScript symbols without TSDoc or without a why-shaped @remarks. Uses Anthropic Claude to either suggest an inline TSDoc or ask the author targeted questions about the why."
author: "stephengeller"
branding:
  icon: "book-open"
  color: "purple"

# Consumer workflow must grant:
#   permissions.pull-requests: write (to post the PR review + inline comments)
#   permissions.contents: read      (to fetch changed files)
# GITHUB_TOKEN is provided automatically by GitHub. Supply Claude credentials
# via either a Bedrock API key (`bedrock-api-key` + `bedrock-region`, preferred)
# or the `anthropic-api-key` input. Pass keys from workflow secrets.

inputs:
  anthropic-api-key:
    description: "Anthropic API key for the direct API (api.anthropic.com). Provide this OR a Bedrock key. Pass via a workflow secret."
    required: false
  bedrock-api-key:
    description: "Amazon Bedrock API key (bearer token), used with `bedrock-region` to call Claude through Bedrock. Preferred: inference runs in your own AWS account, authenticated with just a key stored as a workflow secret (no IAM role or OIDC). Takes precedence over `anthropic-api-key`."
    required: false
  bedrock-region:
    description: "AWS region for the Bedrock endpoint (e.g. `us-east-1`). Required when `bedrock-api-key` is set."
    required: false
  anthropic-model:
    description: "Claude model ID for why-inference. No default here so the provider-appropriate default applies: the direct API uses `claude-sonnet-4-6`, Bedrock uses `anthropic.claude-haiku-4-5`. Override with another model ID, e.g. `anthropic.claude-opus-4-8` on Bedrock for stronger inference."
    required: false
  bypass-label:
    description: "Apply this label to a PR to soft-bypass the why-check. When applied, AI inference is skipped entirely and the check passes. Use sparingly — it's the escape hatch, not the default."
    required: false
    default: "why-acknowledged"
  min-remarks-words:
    description: "Minimum word count for a @remarks block to satisfy the why-acceptance predicate. Counted after stripping {@link ...} fragments."
    required: false
    default: "15"
  why-keywords:
    description: "Comma-separated list of causal/constraint keywords that count as a why-signal. A @remarks block must contain at least one keyword OR a number-with-unit (e.g. 200ms) OR a {@link} reference."
    required: false
    default: "because,so that,to ensure,must,cannot,requires,avoid,prevent,invariant,otherwise"
  max-symbols-for-ai:
    description: "Hard cap on how many symbols the action will send to Claude in a single PR run. PRs above this cap skip AI entirely and post a one-line summary asking the author to document manually or apply the bypass label. Guards against runaway AI spend on mechanical/refactor PRs."
    required: false
    default: "25"

runs:
  using: "node20"
  main: "dist/index.js"
